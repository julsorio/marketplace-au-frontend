<div class="thread-page">
  <button mat-button routerLink="/conversations" class="back-button">
    <mat-icon>arrow_back</mat-icon>
    Mensajes
  </button>

  <mat-card class="thread-card">
    <mat-card-header>
      <mat-card-title>{{ otherParticipantName() || 'Cargando…' }}</mat-card-title>
      <mat-card-subtitle>{{ listingTitle() }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (isLoading()) {
        <div class="loading-container">
          <mat-spinner></mat-spinner>
        </div>
      } @else {
        <div class="messages" #messagesContainer>
          @if (messages().length === 0) {
            <p class="no-messages">Escribe el primer mensaje para iniciar la conversación.</p>
          }
          @for (m of messages(); track m.id) {
            <div class="message-row" [class.mine]="m.senderId === myId()">
              <div class="message-bubble">
                <p>{{ m.text }}</p>
                <span class="message-time">{{ m.sentAt | date: 'shortTime' }}</span>
              </div>
            </div>
          }
        </div>
      }

      <form [formGroup]="messageForm" (ngSubmit)="onSend()" class="send-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Escribe un mensaje…</mat-label>
          <input matInput formControlName="text" (keyup.enter)="onSend()" />
        </mat-form-field>
        <button mat-icon-button color="primary" type="submit" [disabled]="isSending() || messageForm.invalid">
          <mat-icon>send</mat-icon>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
